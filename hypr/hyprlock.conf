general{
    hide_cursor = true
    immediate_render = true
    text_trim = true
 }

background {
  monitor  = eDP-2
  path = /home/ras/.config/omg/Two.jpg
  blur_passes = 2
  brightness = 0.6
}
# ГОДИННИК
label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 64
    font_family = Noto Sans
    position = 0, 80
    halign = center
    valign = center
}

# ПОЛЕ ВВОДУ ПАРОЛЯ
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
